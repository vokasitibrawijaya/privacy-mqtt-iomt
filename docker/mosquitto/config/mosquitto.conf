# Mosquitto Configuration for IoMT Experiment
# ============================================

# Listener Configuration
listener 1883
protocol mqtt

# WebSocket (optional)
listener 9001
protocol websockets

# Allow anonymous connections (for experiment simplicity)
# In production, use authentication
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

# Connection settings
max_connections -1
max_inflight_messages 100
max_queued_messages 1000

# Keep alive
max_keepalive 120

# Message size limit (untuk payload medis)
message_size_limit 1048576
